# snake — the classic snake game, as a desktop app.
#
# A GUI module: it gets an icon and a tile on the desktop, and its page
# is mounted at /apps/snake/man/snake. It is a game, so it asks the
# kernel for a per-window animation tick (gfx_anim) to get a frame beat
# far faster than the one-per-second heartbeat every window is given.

NAME=snake
SOURCES="snake.c"

# A desktop app, not a command: a tile, and reachable through `man` too.
GUI=1

# Green, because it is a snake, and the letter glyph ("S") rather than a
# pictogram, since no pictogram is a game of any kind.
COLOR=10
GLYPH=0

MAN=man/snake.1
ABOUT="the classic snake game"
