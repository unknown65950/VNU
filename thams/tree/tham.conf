# tree — list directories as a tree.
#
# A first module, and the whole point of having one: this file lives in
# thams/ and not in vnu/userspace/, and nothing in the system tree was
# edited to make it a command. See thams/README.md.

# The module's name. It has to match the directory name, because the
# directory is what the build scans.
NAME=tree

# What to compile. As many files as the module likes, and it may
# include its own headers with #include "...".
SOURCES="tree.c"

# A command, not a desktop app, so no tile on the desktop.
GUI=0

# The page `man tree` prints. A module that is not a GUI app should
# still have one.
MAN=man/tree.1

ABOUT="list directories as a tree"