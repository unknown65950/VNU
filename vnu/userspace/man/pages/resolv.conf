NAME
    resolv.conf - DNS server configuration

DESCRIPTION
    /etc/resolv.conf lists the DNS servers the kernel queries when a
    name is not found in /etc/hosts. Each 'nameserver a.b.c.d' line
    adds a server; they are tried in order until one answers. Comment
    lines start with '#' or ';'.

    The default file contains 'nameserver 1.1.1.1'. If the file is
    missing or lists no servers, 1.1.1.1 is used. Under QEMU's slirp
    user network the guest-side resolver is also reachable at
    10.0.2.3, and any external server (1.1.1.1, 8.8.8.8, ...) is
    forwarded through the host's NAT.

FILES
    /etc/resolv.conf
